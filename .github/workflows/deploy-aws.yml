name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-cloud-webapp
  ECS_CLUSTER: ai-cloud-webapp-cluster
  ECS_SERVICE: ai-cloud-webapp-service
  CONTAINER_NAME: ai-cloud-webapp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to ECR
        id: build-image
        timeout-minutes: 15
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          for i in {1..3}; do
            if docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG; then
              echo "Push successful"
              break
            elif [ $i -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            else
              wait_time=$((2 ** (i - 1)))
              echo "Push attempt $i failed. Retrying in ${wait_time}s..."
              sleep $wait_time
            fi
          done

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}